<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Track</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="../assets/favicon_io (1)/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-gray-100">
    <main class="grid grid-cols-[280px_1fr] h-screen">
        <aside class="bg-white shadow-2xl ">
            <!-- logo -->
            <div class="flex items-center gap-2 p-2">
                <img src="../assets/dashboard_logo.png" alt="logo" width="90" height="90" class="pb-2">
                <div class="flex flex-col">
                    <h1 class="text-2xl font-bold leading-none">
                        <span class="text-[#082850]">BUILD</span><span class="text-orange-600">TRACK</span>
                    </h1>

                    <p class="text-xs text-gray-400 mt-1">
                        Construction Project Monitoring
                    </p>
                </div>
            </div>
            <hr>

            <!-- menu -->

            <div class="flex flex-col justify-between">
                <ul class="flex flex-col gap-6 p-4">
                    <li><a href="../adminPanal/adminDashboard.html"
                            class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-table-cells-large"></i> Dashboard</a></li>
                    <li><a href="projectDetails.html" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-trowel-bricks"></i> Projects</a></li>
                    <li><a href="workerDetails.html" class="p-2 rounded-lg  hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-users"></i>
                            Workers</a></li>
                    <li><a href="materialsDetails.html" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i class="fa-solid fa-box"></i>
                            Materials</a></li>
                    <li><a href="#" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-calendar-days"></i> Schedule</a></li>
                    <li><a href="#" class="p-2 rounded-lg bg-[#082850] text-white"><i
                                class="fa-solid fa-location-dot"></i> Site Monitoring</a></li>
                    <li><a href="#" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-chart-line"></i> Reports</a></li>
                    <li><a href="#" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-triangle-exclamation"></i> Issues</a></li>
                </ul>
                <hr>
                <ul class="flex flex-col gap-6 p-4">
                    <li><a href="#" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-gear"></i> Settings</a></li>
                    <li><a href="adminPanel.html" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
                </ul>
            </div>
        </aside>

        <!-- main content -->

        <section class="bg-gray-100 p-3 overflow-y-auto">
            <div class="bg-white p-4 rounded shadow">
                <div class="flex justify-between items-center gap-3">
                    <div class="flex gap-3 justify-between items-center">
                        <div class="relative w-80">
                            <i
                                class="fa-solid fa-magnifying-glass absolute left-3  top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input type="text" placeholder="Search Project..."
                                class="w-full h-10 border border-gray-300 rounded-lg pl-10 pr-4 focus:outline-none focus:ring-1 focus:ring-gray-500">
                        </div>

                        <div class="dropdown">
                            <button class="btn bg-[#082850] text-white dropdown-toggle" type="button"
                                id="dropdownMenuButton2" data-bs-toggle="dropdown" aria-expanded="false">
                                Status
                            </button>
                            <ul class="dropdown-menu dropdown-menu-white" aria-labelledby="dropdownMenuButton2">
                                <li><a class="dropdown-item" href="#">Planning</a></li>
                                <li><a class="dropdown-item" href="#">Approved</a></li>
                                <li><a class="dropdown-item" href="#">In Progress</a></li>
                                <li><a class="dropdown-item" href="#">On Hold</a></li>
                                <li><a class="dropdown-item" href="#">Delayed</a></li>
                                <li><a class="dropdown-item" href="#">Inspection</a></li>
                                <li><a class="dropdown-item" href="#">Completed</a></li>
                                <li><a class="dropdown-item" href="#">Cancelled</a></li>
                            </ul>
                        </div>
                    </div>
                    <div>
                        <a href="#" class="font-medium text-gray-500"><i class="fa-solid fa-plus"></i>
                            Add Site</a>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/c219e56bfb.js" crossorigin="anonymous"></script>
</body>
</html>
